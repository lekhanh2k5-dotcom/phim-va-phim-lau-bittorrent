<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Phim, phát hành và chia sẻ — IMDb × TMDb × MagnetDB</title>
<style>
:root{--paper:#f5f3ed;--surface:#fffefa;--ink:#202b30;--muted:#617079;--line:#dadfdc;--teal:#246961;--gold:#ac6d22;--tint:#eaf1ed;--rose:#fff2df}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:17px/1.45 'Segoe UI',Arial,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.35;cursor:default}button[hidden],[hidden]{display:none!important}.toolbar{height:58px;max-width:1500px;margin:auto;padding:8px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:12px;font-weight:700;letter-spacing:.12em}.brand span{display:block;color:var(--muted);font-weight:400;letter-spacing:0;font-size:12px;margin-top:2px}.tools{display:flex;gap:8px}.tools button,.close-button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;font-size:13px}.tools button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:white}.stage{max-width:1500px;height:calc(100dvh - 156px);min-height:460px;margin:auto;padding:12px 28px 8px}.slide{display:none;height:100%;flex-direction:column;gap:10px;min-width:0}.slide.active{display:flex}.slide-heading{flex-shrink:0}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--teal);margin:0 0 7px}.eyebrow span{color:var(--muted);font-weight:400;letter-spacing:0;margin-left:9px}h2{font-size:clamp(23px,2.2vw,34px);line-height:1.16;letter-spacing:-.025em;margin:0;max-width:1250px}.scope{font-size:12px;color:var(--muted);margin:0;flex-shrink:0}.figure-frame{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;width:100%;padding:5px;border:1px solid var(--line);border-radius:12px;background:white;overflow:hidden;cursor:zoom-in}.figure-frame img{width:100%;height:100%;object-fit:contain;display:block}.takeaways{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;flex-shrink:0}.takeaways>div{border-top:2px solid var(--teal);padding:8px 10px 0 0}.takeaways .next-question{border-color:var(--gold);padding-left:12px}.label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:700;margin-bottom:3px}.next-question .label{color:var(--gold)}.takeaways p{font-size:16px;line-height:1.4;margin:0}.caution{font-size:12px;line-height:1.35;color:#735421;border-left:3px solid var(--gold);padding:4px 9px;background:var(--rose);margin:0;flex-shrink:0}.figure-hint{font-size:11px;color:var(--muted);margin:0;flex-shrink:0}.subtitle{font-size:20px;color:var(--muted);max-width:1050px;margin:6px 0 15px}.concept-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-content:center;flex:1}.concept-cards>div{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:24px;position:relative}.card-number{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.08em}h3{font-size:23px;margin:9px 0}.concept-cards p{font-size:18px;color:var(--muted);margin:0;line-height:1.6}.hero{justify-content:center;gap:18px}.hero .slide-heading h2{font-size:clamp(42px,4.6vw,72px);max-width:1180px;line-height:1.08;letter-spacing:-.04em}.hero .subtitle{font-size:22px;margin:0}.hero .concept-cards{flex:0;margin:6px 0}.hero .concept-cards>div{padding:18px 24px;border-top:3px solid var(--teal)}.hero .concept-cards h3{font-size:25px;margin:6px 0}.hero .concept-cards p{font-size:17px}.hero .card-number{display:none}.hero-footer{font-size:13px;color:var(--muted);margin:0}.hero-footer span{margin-left:20px;color:var(--gold)}.ending .concept-cards{gap:20px}.ending .concept-cards p{font-size:20px}.deck-footer{height:98px;max-width:1500px;margin:auto;padding:8px 28px 12px;display:flex;flex-direction:column;gap:8px}.chapter-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}.chapter-nav button{white-space:nowrap;font-size:12px;border:0;border-radius:5px;padding:5px 9px;background:transparent;color:var(--muted)}.chapter-nav button.active{color:var(--teal);background:var(--tint);font-weight:700}.navigation{display:flex;justify-content:space-between;align-items:center;gap:12px}.navigation .nav-buttons{display:flex;gap:10px;align-items:center}.navigation button{border:1px solid var(--line);border-radius:7px;padding:6px 13px;background:var(--surface);font-size:14px}.navigation button#next{background:var(--teal);color:white;border-color:var(--teal)}.counter{font-size:13px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}.key-hint{font-size:11px;color:var(--muted)}.progress-track{height:3px;background:var(--line);flex:1;max-width:340px;border-radius:9px}.progress-track div{height:100%;background:var(--gold);transition:width .15s;border-radius:9px}.notes{position:fixed;right:16px;top:66px;bottom:108px;width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 45px #14252d25;border-radius:14px;z-index:5;overflow:auto;padding:24px}.notes header{display:flex;justify-content:space-between;gap:15px;align-items:center}.notes h2{font-size:24px}.notes h3{font-size:15px;color:var(--teal);margin:24px 0 8px}.notes p{font-size:16px;line-height:1.6;margin:8px 0}.notes .note-scope{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.notes .note-limit{border-left:3px solid var(--gold);padding-left:12px}.modal{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:24px;color:var(--ink);max-width:min(900px,calc(100vw - 32px));max-height:85dvh}.modal::backdrop{background:#17262bb3}.modal header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.modal h2{font-size:26px}.toc-items{display:grid;grid-template-columns:1fr 1fr;gap:7px;overflow:auto;max-height:65dvh}.toc-items button{text-align:left;border:1px solid var(--line);background:white;border-radius:7px;padding:10px;font-size:14px;line-height:1.4}.toc-items button.current{border-color:var(--teal);background:var(--tint)}.toc-items .toc-index{display:inline-block;color:var(--gold);font-size:12px;min-width:28px;font-weight:700}.zoom{width:calc(100vw - 32px);max-width:none;height:calc(100dvh - 32px);max-height:none;padding:15px}.zoom header{height:42px;margin:0 0 10px}.zoom h2{font-size:16px}.zoom img{width:100%;height:calc(100% - 85px);object-fit:contain;background:white}.zoom p{font-size:12px;color:var(--muted);margin:7px 0}.noscript{background:var(--rose);padding:20px}.mode-notes .notes{display:block}@media(max-height:800px) and (min-width:901px){.stage{min-height:400px;gap:6px}.slide{gap:7px}h2{font-size:27px}.takeaways p{font-size:14px}.concept-cards>div{padding:16px}.concept-cards p{font-size:16px}.concept-cards h3{font-size:21px}.subtitle{font-size:18px;margin:0 0 10px}.hero .slide-heading h2{font-size:48px}.hero .subtitle{font-size:19px}.hero{gap:12px}.ending .concept-cards p{font-size:17px}}@media(max-width:900px){.toolbar{height:auto;min-height:64px;padding:12px 16px;align-items:flex-start}.brand{max-width:250px}.brand span{max-width:210px}.tools{flex-wrap:wrap;justify-content:flex-end;gap:5px}.tools button{font-size:12px;padding:5px 8px}.tools #print{display:none}.stage{height:auto;min-height:0;padding:12px 16px}.slide{height:auto;min-height:60dvh}.figure-frame{min-height:250px;flex:none}.figure-frame img{height:auto;max-height:55dvh}.takeaways{grid-template-columns:1fr;gap:10px}.takeaways .next-question{padding-left:0}.concept-cards{grid-template-columns:1fr;gap:10px}.concept-cards>div{padding:18px}.concept-cards h3{font-size:22px}.concept-cards p{font-size:17px}.hero .slide-heading h2{font-size:40px}.hero .subtitle{font-size:18px}.hero-footer span{display:block;margin:5px 0 0}.ending .concept-cards p{font-size:17px}.subtitle{font-size:18px}.deck-footer{height:auto;position:sticky;bottom:0;background:var(--paper);padding:12px 16px;border-top:1px solid var(--line);z-index:3}.key-hint{display:none}.progress-track{max-width:100px}.notes{top:78px;bottom:116px}.toc-items{grid-template-columns:1fr}}@media print{@page{size:A4 landscape;margin:9mm}.toolbar,.deck-footer,.notes,.modal,.figure-hint,.noscript{display:none!important}body{background:white;font-size:13px}.stage{height:auto;padding:0;max-width:none}.slide,.slide.active{display:flex;height:190mm;break-after:page;page-break-after:always;gap:6px}.slide:last-child{break-after:auto}h2{font-size:22px}.scope,.caution{font-size:10px}.takeaways p{font-size:12px}.figure-frame{border:0;border-radius:0;flex:1;min-height:0}.figure-frame img{max-height:none}.concept-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.hero .slide-heading h2{font-size:40px}.concept-cards p,.ending .concept-cards p{font-size:15px}.subtitle{font-size:18px}}
</style>
</head>
<body>
<header class="toolbar">
 <div class="brand">TÍCH HỢP & PHÂN TÍCH DỮ LIỆU LỚN<span>IMDb · TMDb / JustWatch · MagnetDB</span></div>
 <div class="tools"><button id="toc" title="Mục lục (M)">Mục lục</button><button id="notes-toggle" aria-controls="notes" aria-pressed="false" title="Lời dẫn (N)">Lời dẫn</button><button id="full" title="Toàn màn hình (F)">Toàn màn hình</button><button id="print">In / PDF</button></div>
</header>
<noscript><div class="noscript">Bật JavaScript để chuyển trang; vẫn có thể in bài bằng trình duyệt.</div></noscript>
<main id="stage" class="stage"><!-- SLIDES --></main>
<footer class="deck-footer">
 <nav id="chapters" class="chapter-nav" aria-label="Chuyển phần"></nav>
 <div class="navigation"><span class="key-hint">← / → chuyển trang · N lời dẫn · Z phóng to hình</span><div class="progress-track" aria-hidden="true"><div id="progress"></div></div><div class="nav-buttons"><button id="prev">← Trước</button><span id="count" class="counter" aria-live="polite"></span><button id="next">Tiếp →</button></div></div>
</footer>
<aside id="notes" class="notes" hidden aria-label="Lời dẫn cho trang hiện tại">
 <header><h2>Lời dẫn</h2><button class="close-button" id="notes-close">Đóng</button></header>
 <p id="note-scope" class="note-scope"></p><h3>Vì sao đến hình này?</h3><p id="note-why"></p>
 <h3 id="reading-heading">Cách đọc</h3><p id="note-reading"></p><h3 id="finding-heading">Câu chốt</h3><p id="note-finding"></p>
 <h3 id="limit-heading">Giữ đúng phạm vi</h3><p id="note-limit" class="note-limit"></p>
 <h3 id="next-heading">Câu nối</h3><p id="note-next"></p>
</aside>
<dialog id="toc-modal" class="modal"><header><h2>Mạch thuyết trình · 32 trang</h2><button class="close-button" id="toc-close">Đóng</button></header><div id="toc-items" class="toc-items"></div></dialog>
<dialog id="zoom-modal" class="modal zoom"><header><h2 id="zoom-title"></h2><button class="close-button" id="zoom-close">Đóng · Esc</button></header><img id="zoom-image" alt=""><p id="zoom-caption"></p></dialog>
<script type="application/json" id="slide-data"><!-- DATA --></script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('slide-data').textContent);
const slides=[...document.querySelectorAll('.slide')];
const byId=id=>document.getElementById(id);
const toc=byId('toc-modal'),zoom=byId('zoom-modal');
let pos=0;
const stageNames=[...new Set(data.map(s=>s.phase))];
for(const name of stageNames){const button=document.createElement('button');button.textContent=name;button.dataset.phase=name;button.onclick=()=>show(data.findIndex(s=>s.phase===name));byId('chapters').append(button)}
for(const [i,s] of data.entries()){const button=document.createElement('button');const n=document.createElement('span');n.className='toc-index';n.textContent=String(i+1).padStart(2,'0');button.append(n,document.createTextNode(s.title));button.dataset.index=i;button.onclick=()=>{toc.close();show(i)};byId('toc-items').append(button)}
function noteText(id,text,heading){byId(id).textContent=text||'';byId(id).hidden=!text;if(heading)byId(heading).hidden=!text}
function updateNotes(){const s=data[pos];noteText('note-scope',s.scope||'Dẫn nhập / kết luận');noteText('note-why',s.why||s.notes);noteText('note-reading',s.reading,'reading-heading');noteText('note-finding',s.finding,'finding-heading');noteText('note-limit',s.limitation,'limit-heading');noteText('note-next',s.next_question,'next-heading')}
function show(index,updateHash=true){pos=Math.max(0,Math.min(slides.length-1,index));slides.forEach((s,i)=>{s.classList.toggle('active',i===pos);s.setAttribute('aria-hidden',String(i!==pos))});byId('prev').disabled=pos===0;byId('next').disabled=pos===slides.length-1;byId('count').textContent=(pos+1)+' / '+slides.length;byId('progress').style.width=((pos+1)/slides.length*100)+'%';document.querySelectorAll('#chapters button').forEach(b=>{const active=b.dataset.phase===data[pos].phase;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'step':'false')});document.querySelectorAll('#toc-items button').forEach(b=>b.classList.toggle('current',Number(b.dataset.index)===pos));updateNotes();if(updateHash)history.replaceState(null,'','#'+(pos+1));window.scrollTo(0,0)}
function move(delta){show(pos+delta)}
function toggleNotes(){const opening=byId('notes').hidden;byId('notes').hidden=!opening;byId('notes-toggle').setAttribute('aria-pressed',String(opening));if(opening)updateNotes()}
function openZoom(){const source=slides[pos].querySelector('img');if(!source)return;byId('zoom-image').src=source.src;byId('zoom-image').alt=source.alt;byId('zoom-title').textContent=data[pos].title;byId('zoom-caption').textContent=data[pos].caution||data[pos].scope;zoom.showModal()}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{byId('full').textContent='Có thể dùng F11'}}
function fromHash(){const n=Number(location.hash.slice(1));return Number.isInteger(n)&&n>=1&&n<=slides.length?n-1:0}
byId('prev').onclick=()=>move(-1);byId('next').onclick=()=>move(1);byId('notes-toggle').onclick=toggleNotes;byId('notes-close').onclick=toggleNotes;byId('full').onclick=fullscreen;byId('print').onclick=()=>window.print();byId('toc').onclick=()=>toc.showModal();byId('toc-close').onclick=()=>toc.close();byId('zoom-close').onclick=()=>zoom.close();document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=openZoom);
document.addEventListener('keydown',e=>{if(toc.open||zoom.open)return;if(e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const k=e.key.toLowerCase();if(['arrowright','pagedown'].includes(k)||(k===' '&&e.target.tagName!=='BUTTON')){e.preventDefault();move(1)}else if(['arrowleft','pageup'].includes(k)){e.preventDefault();move(-1)}else if(k==='home'){e.preventDefault();show(0)}else if(k==='end'){e.preventDefault();show(slides.length-1)}else if(k==='n')toggleNotes();else if(k==='z')openZoom();else if(k==='f')fullscreen();else if(k==='m')toc.showModal();else if(k==='escape'&&!byId('notes').hidden)toggleNotes()});
window.addEventListener('hashchange',()=>show(fromHash(),false));show(fromHash());
</script>
</body>
</html>
